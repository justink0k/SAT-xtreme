# SAT Xtreme dashboard (template)
#
# Paste this into a new dashboard: Settings > Dashboards > Add dashboard > open it >
# three dots > Edit dashboard > three dots > Raw configuration editor.
#
# Replace the entity IDs below with yours (search for them under Settings > Entities):
#   climate.sat                                  your SAT thermostat
#   ..._sat                                      the sensors and buttons of SAT; the suffix is your SAT
#                                                name (for a SAT named "Living Room": _living_room)
#   sensor.otgw_control_setpoint                 OTGW control setpoint (TSet)
#   sensor.otgw_boiler_flow_water_temperature    OTGW flow temperature (Tboiler)
#   sensor.otgw_relative_modulation_level        OTGW relative modulation level
#   binary_sensor.otgw_flame                     OTGW flame
#   binary_sensor.otgw_central_heating_enable    OTGW central heating enable (master status)
#   binary_sensor.otgw_domestic_hot_water        OTGW domestic hot water active (slave status)
#   sensor.otgw_burner_starts                    OTGW burner starts
#   sensor.flame_status                          SAT flame status ("Flame Status")
#
# The PWM, Learned OPV and Calibration cards need the matching Xtreme profile switches; without
# them those entities do not exist and the cards show "entity not available".
# Only standard Home Assistant cards are used.

title: SAT Xtreme
views:
  - title: SAT Xtreme
    path: sat-xtreme
    icon: mdi:fire
    cards:
      - type: vertical-stack
        cards:
          - type: thermostat
            entity: climate.sat
          - type: entities
            title: Now
            entities:
              - type: attribute
                entity: climate.sat
                attribute: pulse_width_modulation_state
                name: PWM phase
              - type: attribute
                entity: climate.sat
                attribute: pulse_width_modulation_duty_cycle
                name: PWM on / off time (s)
              - type: attribute
                entity: climate.sat
                attribute: minimum_setpoint
                name: OPV in use
                suffix: °C
              - entity: sensor.flame_status
                name: Flame status
              - entity: sensor.anti_cycling_remaining_sat
                name: Anti-cycling remaining
              - entity: sensor.otgw_relative_modulation_level
                name: Modulation
              - entity: sensor.current_power_sat_boiler
                name: Power now

      - type: vertical-stack
        cards:
          - type: history-graph
            title: Last 6 hours
            hours_to_show: 6
            entities:
              - entity: sensor.otgw_control_setpoint
                name: Control setpoint
              - entity: sensor.otgw_boiler_flow_water_temperature
                name: Flow
          - type: history-graph
            hours_to_show: 6
            entities:
              - entity: sensor.otgw_relative_modulation_level
                name: Modulation
          - type: history-graph
            hours_to_show: 6
            entities:
              - entity: binary_sensor.otgw_flame
                name: Flame
              - entity: binary_sensor.otgw_central_heating_enable
                name: Heating demand
              - entity: binary_sensor.otgw_domestic_hot_water
                name: Hot water

      - type: vertical-stack
        cards:
          - type: entities
            title: PWM blocks
            entities:
              - entity: sensor.pwm_burn_time_sat
                name: Burn time of the last block
              - type: attribute
                entity: sensor.pwm_burn_time_sat
                attribute: target_seconds
                name: Planned on time of the last block
                suffix: s
              - type: attribute
                entity: sensor.pwm_burn_time_sat
                attribute: current_burn_seconds
                name: Burn time of the current block
                suffix: s
          - type: history-graph
            title: Burn time per block (24 hours)
            hours_to_show: 24
            entities:
              - entity: sensor.pwm_burn_time_sat
                name: Burn time
              - entity: sensor.anti_cycling_remaining_sat
                name: Anti-cycling remaining
          - type: statistics-graph
            title: Burner starts per day
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - entity: sensor.otgw_burner_starts
                name: Starts

      - type: vertical-stack
        cards:
          - type: entities
            title: Learned OPV
            entities:
              - entity: sensor.learned_opv_sat
                name: Learned OPV
              - type: attribute
                entity: sensor.learned_opv_sat
                attribute: mode
                name: Mode
              - type: attribute
                entity: sensor.learned_opv_sat
                attribute: sample_count
                name: Samples
              - type: attribute
                entity: sensor.learned_opv_sat
                attribute: last_update
                name: Last update
              - type: attribute
                entity: sensor.learned_opv_sat
                attribute: source
                name: Started from
          - type: history-graph
            title: Learned OPV (7 days)
            hours_to_show: 168
            entities:
              - entity: sensor.learned_opv_sat
                name: Learned OPV

      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: button
                name: Start calibration
                icon: mdi:play
                entity: button.start_xtreme_calibration_sat
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.start_xtreme_calibration_sat
                  confirmation:
                    text: Start the calibration? It can take up to 10 hours. SAT pauses its normal control in the meantime.
              - type: button
                name: Stop calibration
                icon: mdi:stop
                entity: button.stop_xtreme_calibration_sat
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.stop_xtreme_calibration_sat
                  confirmation:
                    text: Stop the calibration and return to normal operation?
          - type: entities
            title: Calibration
            entities:
              - entity: sensor.calibration_sat
                name: Phase
              - type: attribute
                entity: sensor.calibration_sat
                attribute: message
                name: Status
              - type: attribute
                entity: sensor.calibration_sat
                attribute: round
                name: Round
              - type: attribute
                entity: sensor.calibration_sat
                attribute: valid_rounds
                name: Valid rounds
              - type: attribute
                entity: sensor.calibration_sat
                attribute: setpoint
                name: Current setpoint
                suffix: °C
              - type: attribute
                entity: sensor.calibration_sat
                attribute: elapsed_minutes
                name: Running for
                suffix: min
          - type: markdown
            title: Last calibration report
            content: >-
              {% set r = state_attr('sensor.calibration_sat', 'report') %}
              {% if r %}
              **{{ r.message }}**

              Outcome: {{ r.outcome }} · Duration: {{ r.duration_minutes }} min

              {% if r.result is not none %}Result: **{{ r.result }} °C**, spread {{ r.spread }} °C (min {{ r.minimum }} °C, max {{ r.maximum }} °C){% endif %}

              | Round | Result | Value | Steps |
              |---|---|---|---|
              {% for x in r.rounds %}| {{ x.number }} | {{ x.result }} | {{ x.value if x.value is not none else '–' }} | {{ x.steps | length }} |
              {% endfor %}
              {% else %}
              No calibration has run yet.
              {% endif %}
