<path class="bracket" d="M150.0,160 V166 H260.7 V160"/>
<text class="note" x="152.0" y="182">waiting for the setpoint: 2 min lost</text>
<text class="title" x="150" y="218">SAT-xtreme (setpoint priming)</text>
