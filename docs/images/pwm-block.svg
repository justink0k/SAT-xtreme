<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="One PWM block: with SAT 4.2.1 the flame starts 2 minutes after the heating demand, with SAT-xtreme after 5 seconds">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 15px; font-weight: 600; }
  .label, .value, .tick { font-size: 12px; fill: #59636e; }
  .note { font-size: 12px; font-weight: 600; fill: #bc4c00; }
  .track { fill: #eff2f5; }
  .demand { fill: #0969da; }
  .flame { fill: #fb8500; }
  .setpoint { fill: none; stroke: #8250df; stroke-width: 2.5; }
  .bracket { fill: none; stroke: #bc4c00; stroke-width: 1.5; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    text { fill: #f0f6fc; }
    .label, .value, .tick { fill: #9198a1; }
    .note { fill: #ffa657; }
    .track { fill: #262c36; }
    .demand { fill: #4493f8; }
    .flame { fill: #ffa657; }
    .setpoint { stroke: #ab7df8; }
    .bracket { stroke: #ffa657; }
    .grid { stroke: #3d444d; }
  }
</style>
<line class="grid" x1="150.0" y1="20" x2="150.0" y2="376"/>
<text class="tick" x="150.0" y="390" text-anchor="middle">0</text>
<line class="grid" x1="202.7" y1="20" x2="202.7" y2="376"/>
