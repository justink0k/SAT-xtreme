<text class="tick" x="360.9" y="390" text-anchor="middle">4</text>
<line class="grid" x1="413.6" y1="20" x2="413.6" y2="376"/>
<line class="grid" x1="466.4" y1="20" x2="466.4" y2="376"/>
<text class="tick" x="466.4" y="390" text-anchor="middle">6</text>
<line class="grid" x1="519.1" y1="20" x2="519.1" y2="376"/>
<line class="grid" x1="571.8" y1="20" x2="571.8" y2="376"/>
<text class="tick" x="571.8" y="390" text-anchor="middle">8</text>
<line class="grid" x1="624.5" y1="20" x2="624.5" y2="376"/>
<line class="grid" x1="677.3" y1="20" x2="677.3" y2="376"/>
<text class="tick" x="677.3" y="390" text-anchor="middle">10</text>
<line class="grid" x1="730.0" y1="20" x2="730.0" y2="376"/>
<text class="tick" x="730.0" y="408" text-anchor="end">minutes after the heating demand</text>
<text class="title" x="150" y="28">SAT 4.2.1</text>
<text class="label" x="138" y="54" text-anchor="end">Heating demand</text>
<text class="label" x="138" y="96" text-anchor="end">Setpoint (°C)</text>
<text class="label" x="138" y="144" text-anchor="end">Flame</text>
